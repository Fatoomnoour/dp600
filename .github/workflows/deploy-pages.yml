name: Deploy DP-600 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build website
        env:
          BASE_PATH: /dp600/
        run: npm run build

      - name: Real files for every SPA route (direct open = HTTP 200, no 404)
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/quiz dist/results
          cp dist/index.html dist/quiz/module-full
          cp dist/index.html dist/quiz/module-quick
          cp dist/index.html dist/quiz/module-wrong
          cp dist/index.html dist/results/module-full
          cp dist/index.html dist/results/module-quick
          cp dist/index.html dist/mistakes
          cp dist/index.html dist/bookmarks
          cp dist/index.html dist/admin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
